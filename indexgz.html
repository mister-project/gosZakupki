<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="”viewport”" content="”user-scalable" ="no”" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/png" href="jmg/150-150.png" />
    <script src="./scripts/modalWindow.js" defer></script>
    <script src="./scripts/exportToJson.js" defer></script>
    <script src="./scripts/importJson.js" defer></script>
    <title>ГОСЗАКУП</title>
  </head>
  <body>
    <!-- МОДАЛЬНОЕ ОКНО НАЧАЛО -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <button id="updateButton">Обновить</button>
        <form id="form"></form>
        <button id="submit">Отправить в таблицу</button>
      </div>
    </div>
    <!-- МОДАЛЬНОЕ ОКНО ОКОНЧАНИЕ -->

    <!-- КНОПКИ НАЧАЛО -->
    <div>
      <button id="downloadBtnJson">СОХРАНИТЬ в JSON все таблицы</button>
    </div>
    <!-- КНОПКИ ОКОНЧАНИЕ -->
    <input type="file" id="fileInput" accept=".json" />

    <div id="advertisement" class="container">
      <a name="zayavki"></a>
      <button id="openModalZayavki">Открыть форму Заявок</button>
      <table id="advertisementTabl" class="table table-striped table-bordered">
        <caption>
          <h3>ЗАЯВКИ</h3>
        </caption>
        <thead>
          <th id="idGroup">id_Заявки</th>
          <th id="dateOfPlacement">Дата_Размещения</th>
          <th id="updated">Обновлено</th>
          <th id="deadline">СрокПодачи</th>
          <th id="deadlineResult">Подведение Итогов</th>
          <th id="objectTransferDeadlines">
            Сроки Передачи Объекта (Контракт)
          </th>
          <th id="paymentPeriod">Сроки Оплаты (Контракт)</th>

          <th id="city">Город</th>
          <th id="Customer">ОрганизацияЗаказчик</th>
          <th id="govContact">Контактное лицо</th>
          <th id="hyperlink">Ссылка</th>
          <th id="initialRate">Сумма заявки</th>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </body>
</html>
